[pytest]
pythonpath = backend
testpaths = tests/backend
addopts = -ra --strict-markers
markers =
    live: requires the running local stack (backend + PostgreSQL + Ollama with the Qwen model)
    corpus: requires the real ISO corpus in "iso booklets"
    slow: long-running (OCR / transcription)
filterwarnings =
    ignore::DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
